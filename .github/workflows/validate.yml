name: validate-data
on:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**', 'config/**', 'tests/**']
  pull_request:
    paths: ['data/**', 'scripts/**', 'config/**', 'tests/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema pyyaml
      - run: python scripts/validate.py
      - run: |
          python tests/test_scout_x.py
          python tests/test_close_expired.py
          python tests/test_check_links.py
          python tests/test_extractor_publisher.py
          python tests/test_collect.py
          python scripts/eval_golden.py
